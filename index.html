<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Layout: one mobile column, four tabs (Aujourd'hui, Calendrier, Conseils, Explorer) in a floating pill bar, profile in a sheet.
   Phase colours = identity of a phase everywhere. Hormone line colours = validated categorical set. */
:root{
  --bg:#F5F2F6; --surface:#FFFFFF; --surface-2:#EFEAF2; --track:#E7E0EE;
  --ink:#2B2231; --ink-2:#5E5568; --ink-3:#6F677A;
  --line:#E3DCE8; --grid:#EAE5EE;
  --accent:#2B2231; --on-accent:#FFFFFF;
  --c-mens:#C73E57; --c-foll:#2F9C84; --c-ovul:#E6A100; --c-lut:#6B58C9; --on-mens:#FFFFFF; --d-mens:#FFFFFF;
  --lilac:#6B4DE6; --cta-1:#E65A92; --cta-2:#C2306F;
  --pink:#E8609A; --cap:#6B3CE8; --dot:#BDB4C9; --badge:#4A4056; --knob:#2B2231; --knob-r:#E7E0EE; --knob-c:#CFC6DA;
  --w-p:#4FAE72; --w-e:#7E97CF; --w-lh:#4DBFC4; --w-fsh:#4B7BE5; --wl-p:#1B7A4B; --wl-e:#2457B3; --wl-lh:#0C7C80; --wl-fsh:#2F55C4;
  --tip:#E6EEFB; --tip-ink:#1F4C8F;
  --h-e2:#2a78d6; --h-p:#eb6834; --h-lh:#1baf7a; --h-fsh:#eda100;
  --danger:#B3261E; --scrim:rgba(24,14,32,.5);
  --f-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0B11; --surface:#17131D; --surface-2:#211B29; --track:#1D1825;
    --ink:#F4EEF8; --ink-2:#C2B8CC; --ink-3:#A399B0;
    --line:#2B2434; --grid:#251F2D;
    --accent:#F4EEF8; --on-accent:#0D0B11;
    --c-mens:#EE7FA8; --c-foll:#4CC7A5; --c-ovul:#F2B44A; --c-lut:#8B6CF0; --on-mens:#17131D; --d-mens:#17131D;
    --lilac:#7C5CF2; --tip:#13203A; --tip-ink:#8DB6F2;
    --pink:#F27BA8; --cap:#6B3CE8; --dot:#4A4455; --badge:#2A2533; --knob:#14101A; --knob-r:#2F2A38; --knob-c:#8A8494;
    --w-p:#8CC49A; --w-e:#8FA9DC; --w-lh:#7DD6D8; --w-fsh:#5C8DF0; --wl-p:#3E9A62; --wl-e:#4A7FCB; --wl-lh:#2F9096; --wl-fsh:#F4EEF8;
    --h-e2:#3987e5; --h-p:#d95926; --h-lh:#199e70; --h-fsh:#c98500;
    --danger:#F2938D; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0B11; --surface:#17131D; --surface-2:#211B29; --track:#1D1825;
  --ink:#F4EEF8; --ink-2:#C2B8CC; --ink-3:#A399B0;
  --line:#2B2434; --grid:#251F2D;
  --accent:#F4EEF8; --on-accent:#0D0B11;
  --c-mens:#EE7FA8; --c-foll:#4CC7A5; --c-ovul:#F2B44A; --c-lut:#8B6CF0; --on-mens:#17131D; --d-mens:#17131D;
  --lilac:#7C5CF2; --tip:#13203A; --tip-ink:#8DB6F2;
    --pink:#F27BA8; --cap:#6B3CE8; --dot:#4A4455; --badge:#2A2533; --knob:#14101A; --knob-r:#2F2A38; --knob-c:#8A8494;
    --w-p:#8CC49A; --w-e:#8FA9DC; --w-lh:#7DD6D8; --w-fsh:#5C8DF0; --wl-p:#3E9A62; --wl-e:#4A7FCB; --wl-lh:#2F9096; --wl-fsh:#F4EEF8;
  --h-e2:#3987e5; --h-p:#d95926; --h-lh:#199e70; --h-fsh:#c98500;
  --danger:#F2938D; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(112px + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
body.lock{overflow:hidden}
.app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
p{margin:0;text-wrap:pretty}
h1,h2,h3{margin:0}
h2{font:600 19px/1.25 var(--f-display);letter-spacing:-.005em;text-wrap:balance}
.ttl{font:600 28px/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance;padding:14px 0 4px}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.panel{display:grid;gap:16px;align-content:start}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.card>*+*{margin-top:12px}
.sec-h{font:600 20px/1.2 var(--f-display);margin-top:6px}

.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;padding:0 16px;cursor:pointer;width:100%}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn-danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn-row{display:grid;gap:10px}
.link-btn{background:none;border:0;min-height:44px;padding:0 12px;color:var(--ink-2);font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.cta{display:block;margin:0 auto;min-height:56px;padding:0 34px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--cta-1),var(--cta-2));color:#fff;font:700 18px var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 22px -10px var(--cta-2)}
.cta svg{width:22px;height:22px}
.pchip{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--pc) 16%,var(--surface));color:var(--ink)}
.pchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.ph-mens{--pc:var(--c-mens)} .ph-foll{--pc:var(--c-foll)} .ph-ovul{--pc:var(--c-ovul)} .ph-lut{--pc:var(--c-lut)}
.banner{border-style:dashed}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.field{display:grid;gap:5px;font-size:13px;color:var(--ink-2);min-width:0}
.field input,textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 12px;font:inherit;font-size:16px}
textarea{padding:10px 12px;resize:vertical;min-height:84px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

/* today */
.topbar{display:flex;align-items:center;gap:12px;min-height:56px}
.avatar-btn{width:56px;height:56px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.avatar-btn svg{width:24px;height:24px}
.avatar-btn b{font:600 24px var(--f-display);color:var(--lilac)}
.back-pill{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ink-3);background:transparent;font-weight:500;font-size:15px;cursor:pointer}
.back-pill[hidden]{display:none}
#wheel{display:block;width:100%;max-width:380px;height:auto;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
#wheel:focus,#wheel:focus-visible{outline:none}
.w-track{fill:none;stroke:var(--track)}
.w-fert{fill:none;stroke:var(--pink);stroke-linecap:round}
.w-capo{fill:none;stroke:var(--bg);stroke-linecap:round}
.w-cap{fill:none;stroke:var(--cap);stroke-linecap:round}
.w-dot{fill:var(--dot)}
.w-dot.f{fill:#fff}
.w-knob{fill:var(--knob);stroke:var(--knob-r);stroke-width:3}
.w-knob-c{fill:var(--knob-c)}
.w-date{font:500 12.5px var(--f-body);fill:var(--ink-2);text-anchor:middle}
.w-phase{font:700 33px var(--f-body);letter-spacing:-.015em;fill:var(--ink);text-anchor:middle}
.w-status{font:500 13.6px var(--f-body);fill:var(--ink-2);text-anchor:middle}
.tri-lo,.hot1{fill:var(--pink)} .tri-hi{fill:#3FBF7F} .hot2{fill:#F5A524}
.w-badge{fill:var(--badge);stroke:var(--bg);stroke-width:5}
.w-badge.fert{fill:#E983AD}
.tri-far{fill:#3FBF7F}
.far{fill:#4CC98A}
.w-badge.today{fill:var(--cap)}
.w-badge-k{font:500 10px var(--f-body);fill:rgba(255,255,255,.72);text-anchor:middle}
.w-badge-n{font:700 23px var(--f-body);fill:#fff;text-anchor:middle}
.wa{fill-opacity:.62;stroke:none}
.lbl{font:500 13px var(--f-body)}
.lb-p{fill:var(--wl-p)} .lb-e{fill:var(--wl-e)} .lb-lh{fill:var(--wl-lh)} .lb-fsh{fill:var(--wl-fsh)}
.hint-p{text-align:center;margin-top:2px}
.hint-row{display:flex;align-items:center;justify-content:center;gap:6px}
.hint-row p{text-align:center;max-width:250px}
.nav-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none}
.nav-btn svg{width:20px;height:20px}
.key-row{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--ink-2)}
.key-row span{display:inline-flex;align-items:center;gap:6px}
.key-row i{width:14px;height:3px;border-radius:2px}
.mc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.badges{display:flex;gap:8px}
.badge{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:15px}
.badge svg{width:22px;height:22px}
.row-btn{width:100%;min-height:60px;border-radius:18px;border:0;background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 9px 0 18px;font-weight:600;font-size:16px;cursor:pointer;text-align:left}
.go{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.go svg{width:20px;height:20px}
.meta{font-size:13px;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 11px;border-radius:999px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.energy{display:grid;gap:0}
.e-row{display:grid;grid-template-columns:88px minmax(0,1fr) 62px 22px;align-items:center;gap:10px;min-height:46px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.e-row:first-child{border-top:0;color:var(--ink);font-weight:700}
.e-bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.e-bar i{display:block;height:100%;border-radius:3px}
.e-lv{font-size:12.5px;color:var(--ink-3);text-align:right}
.e-ico{width:18px;height:18px}
.ask{background:linear-gradient(160deg,#6B4DE6,#5A3FD0);border:0;color:#fff;border-radius:24px;padding:18px 16px}
.ask h2{text-align:center;color:#fff}
.ask-ico{display:grid;place-items:center;margin-bottom:6px}
.ask-ico svg{width:34px;height:34px}
.ask-list{display:grid;gap:8px;margin-top:14px}
.ask-q{min-height:50px;border:0;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-weight:500;font-size:15px;text-align:left;padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ask-q svg{width:18px;height:18px;flex:none;opacity:.8}
.ask small{display:block;text-align:center;margin-top:12px;opacity:.85;font-size:12.5px}

/* hormones (explorer) */
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--ink-3);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s}
.hchip[aria-pressed="false"]{opacity:.5;border-style:dashed}
.hchip i{width:16px;height:3px;border-radius:2px;background:var(--hc)}
#chart{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.band{stroke:none}
.b-mens{fill:color-mix(in srgb,var(--c-mens) 15%,transparent)}
.b-foll{fill:color-mix(in srgb,var(--c-foll) 13%,transparent)}
.b-ovul{fill:color-mix(in srgb,var(--c-ovul) 20%,transparent)}
.b-lut{fill:color-mix(in srgb,var(--c-lut) 13%,transparent)}
.gl{stroke:var(--grid);stroke-width:1}
.axl{stroke:var(--line);stroke-width:1}
.ax{font:500 10px var(--f-mono);fill:var(--ink-3)}
.ax.strong{fill:var(--ink);font-weight:500}
.pl{font:500 10.5px var(--f-body);fill:var(--ink-3)}
.dl{font:600 11px var(--f-body);fill:var(--ink-2)}
.curve{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.selline{stroke:var(--ink);stroke-width:1.5}
.seltri{fill:var(--ink)}
.ov-dot{fill:var(--c-ovul);stroke:var(--surface);stroke-width:2}
.slider-wrap{display:grid;gap:4px}
.slider-wrap label{font-size:12.5px;color:var(--ink-3)}
input[type=range]{width:100%;height:36px;accent-color:var(--lilac);margin:0}
.ro-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.today-tag{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ro-list{display:grid;gap:10px;margin-top:12px}
.ro-row{display:grid;grid-template-columns:auto minmax(78px,auto) minmax(0,1fr) 74px;align-items:center;gap:10px}
.ro-row .key{width:14px;height:3px;border-radius:2px}
.ro-name{color:var(--ink-2);font-size:14px}
.meter{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.ro-val{font-weight:700;font-size:14px;text-align:right}
details{border-top:1px solid var(--line);padding-top:12px}
details+details{margin-top:12px}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
details[open] summary{margin-bottom:8px}
.hdesc{display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
.hdesc strong{color:var(--ink)}
.tbl{overflow-x:auto;max-height:340px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:430px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);font-weight:600}
tbody th{font:500 12px var(--f-mono);color:var(--ink-2)}

/* explorer */
.hero{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:18px}
.hero svg{width:38px;height:38px;flex:none;color:var(--lilac)}
.hero h2{font-size:21px}
.art{width:100%;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;cursor:pointer;text-align:left}
.art-ico{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:26px;flex:none}
.art .eyebrow{color:var(--lilac);font-weight:500}
.art b{display:block;font-weight:600;font-size:16px;line-height:1.3;margin:2px 0}
.art span.m{font-size:13px;color:var(--ink-3)}
.arts{display:grid;gap:10px}
.guide-list,.adv ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.guide-list li,.adv li{position:relative;padding-left:16px}
.guide-list li::before,.adv li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--pc,var(--ink-3))}

/* calendar */
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--c-mens);display:inline-block}
.lg-per{background:color-mix(in srgb,var(--c-mens) 38%,var(--surface))}
.lg-est{border-style:dashed!important}
.lg-fer{border-color:var(--c-lut)!important;border-style:dashed!important}
.lg-ovu{border-color:var(--c-lut)!important;background:color-mix(in srgb,var(--c-lut) 40%,var(--surface))}
.month-t{font:600 22px var(--f-display);text-transform:capitalize;margin:10px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font:500 12px var(--f-mono);color:var(--ink-3);text-align:center;padding:4px 0}
.day{position:relative;aspect-ratio:1/1;border:1.5px solid transparent;border-radius:14px;background:transparent;color:var(--ink);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0;cursor:pointer;min-width:0}
.day.future{color:var(--ink)}
.day.est{border:1.5px dashed var(--c-mens)}
.day.fertile{border:1.5px dashed var(--c-lut)}
.day.period{background:color-mix(in srgb,var(--c-mens) 38%,var(--surface));border-color:transparent;font-weight:700}
.day.ovu{background:color-mix(in srgb,var(--c-lut) 40%,var(--surface));border:1.5px solid var(--c-lut);font-weight:700}
.day.today{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:700}
.day .dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--lilac)}
.day.today .dot{background:var(--bg)}
.day.blank{pointer-events:none}
.day.absent{border:1.5px dashed var(--ink-3);background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink-3) 28%,transparent) 5px 6px)}
.day .pk{position:absolute;top:5px;right:7px;width:9px;height:5px;border-radius:3px;background:var(--cta-1)}
.day.today .pk{background:var(--bg)}
.lg-abs{border-color:var(--ink-3)!important;border-style:dashed!important;background:repeating-linear-gradient(135deg,transparent 0 3px,color-mix(in srgb,var(--ink-3) 35%,transparent) 3px 4px)}
.hist .hrow{display:grid;grid-template-columns:96px minmax(0,1fr) 62px 18px;align-items:center;gap:10px;width:100%;min-height:44px;background:none;border:0;padding:0;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.hist li{display:block}
.hist .h-date b{display:block;color:var(--ink);font-weight:600}

/* ---------- cycle model ---------- */
function derive(){
  T=nowN();
  const st=S.settings;
  const days=Object.keys(S.logs).filter(k=>S.logs[k]&&S.logs[k].flow>0).map(dn).filter(n=>n<=T).sort((a,b)=>a-b);
  let runs=[];
  for(const d of days){const l=runs[runs.length-1];if(l&&d-l.end<=2)l.end=d;else runs.push({start:d,end:d});}
  let demo=false;
  if(!runs.length){demo=true;runs=[{start:T-13,end:T-13+st.periodLen-1}];}
  const diffs=[];
  for(let i=1;i<runs.length;i++){const x=runs[i].start-runs[i-1].start;if(x>=18&&x<=60)diffs.push(x);}
  const rec=diffs.slice(-6);
  const useAuto=st.auto&&rec.length>=2;
  const L=clamp(useAuto?Math.round(avg(rec)):st.cycleLen,18,60);
  const done=runs.slice(0,-1).map(r=>r.end-r.start+1).filter(x=>x>=1&&x<=12).slice(-6);
  const P=(st.auto&&done.length>=2)?clamp(Math.round(avg(done)),2,10):st.periodLen;
  const real=runs.map((r,i)=>{
    const last=i===runs.length-1;
    let len=last?L:runs[i+1].start-r.start;
    if(!last&&(len<18||len>60))len=L;
    let M=r.end-r.start+1;
    if(last){
      let ended=false;
      for(let n=r.end+1;n<=T;n++){const l=S.logs[toISO(n)];if(l&&l.flow===0){ended=true;break;}}
      if(!ended&&T<=r.start+P-1)M=Math.max(M,P);
      if(demo)M=P;
    }
    return {start:r.start,len,M,end:r.end,last};
  });
  D={real,L,P,demo,useAuto,rec,wins:[]};
  if(!demo){
    const lc=real[real.length-1];
    for(let k=1;k<=8;k++){
      const e=lc.start+lc.len*k;
      if(e>T)break;
      const key=toISO(e);
      if(S.skips[key])D.wins.push({s:e,e:e+P-1,key,state:'absent'});
      else if(T>=e+2){D.wins.push({s:e,e:e+P-1,key,state:'ask'});break;}
    }
  }
}
function cycleFor(n){
  const R=D.real;
  if(!R.length||n<R[0].start)return null;
  let i=R.length-1;
  while(i>0&&R[i].start>n)i--;
  const c=R[i];
  if(!c.last)return c;
  if(n<=T)return c;
  const next=c.start+c.len;
  if(T>=next)return null;
  if(n<next)return c;
  const k=Math.floor((n-c.start)/c.len);
  return {start:c.start+k*c.len,len:c.len,M:D.P,projected:true,last:false};
}
function infoAt(n){
  const c=cycleFor(n);
  if(!c)return null;
  const d=n-c.start+1,L=c.len;
  if(d>L&&!c.last)return null;
  const O=Math.max(c.M+3,L-S.settings.luteal);
  let ph;
  if(d>L)ph='lut';else if(d<=c.M)ph='mens';else if(d<O-1)ph='foll';else if(d<=O+1)ph='ovul';else ph='lut';
  return {n:n,d:d,L:L,O:O,M:c.M,ph:ph,start:c.start,fertile:d>=O-5&&d<=O,ovu:d===O,proj:!!c.projected,late:d>L?d-L:0};
}
const phaseDay=(d,M,O)=>d<=M?'mens':d<O-1?'foll':d<=O+1?'ovul':'lut';
function curvesFor(L,O){
  const lut=L-O;
  const g=(x,mu,sl,sr)=>{const z=(x-mu)/(x<mu?sl:sr);return Math.exp(-.5*z*z);};
  return {
    e2:x=>10+90*g(x,O-1.6,Math.max(2.4,O*.2),2.6)+40*g(x,O+lut*.5,2.8,3.2),
    p:x=>4+96*g(x,O+lut*.5,2.6,Math.max(2.2,lut*.26)),
    lh:x=>6+84*g(x,O-1,.8,1)+4*g(x,O+lut*.5,3,3),
    fsh:x=>12+88*g(x,1,1,3.2)+50*g(x,O-1,.9,1.1)+24*g(x,L+1,2.2,2.2)

}

}

const isCheck=l=>!!l&&((l.mood&&l.mood.length)||(l.sym&&l.sym.length)||l.note||l.energy!=null);

function bodyStats(){
  let streak=0,n=T;
  if(!hasLog(toISO(n)))n--;
  while(hasLog(toISO(n))){streak++;n--;}
  let pts=0;
  for(const k of Object.keys(S.logs)){
    const l=S.logs[k];
    if(!isCheck(l))continue;
    pts+=10+Math.min(5,((l.mood||[]).length+(l.sym||[]).length))*2+(l.energy!=null?3:0)+(l.flow!=null?5:0);
  }
  return {streak,pts};
}
function energyAt(n){
  const info=infoAt(n);
  if(!info)return 50;
  const f=curvesFor(info.L,info.O),d=Math.min(info.d,info.L);
  let v=clamp(.62*f.e2(d)+14-.12*f.p(d)+(info.late?-8:0),8,100);
  const sums={},cnt={};
  for(const k of Object.keys(S.logs)){
    const l=S.logs[k];
    if(l.energy==null)continue;
    const i=infoAt(dn(k));
    if(!i)continue;
    sums[i.ph]=(sums[i.ph]||0)+(l.energy-1)/4*100;
    cnt[i.ph]=(cnt[i.ph]||0)+1;
  }
  if(cnt[info.ph]>=2)v=.5*v+.5*(sums[info.ph]/cnt[info.ph]);
  return clamp(v,6,100);
}

function fWheel(n){
  const x=dateOf(n);
  const wk=cap(new Intl.DateTimeFormat('fr-FR',{weekday:'short'}).format(x).replace('.',''))+'.';
  let m=new Intl.DateTimeFormat('fr-FR',{month:'long'}).format(x);
  if(m.length>4)m=m.slice(0,4)+'.';
  return wk+' '+x.getDate()+' '+cap(m);
}
function spanPath(r,L,d1,d2){
  let a1=alphaOf(d2,L),a2=alphaOf(d1,L);
  if(a2-a1<.6){a1-=.3;a2+=.3;}
  return arcPath(WG.CX,WG.CY,r,a1,a2);
}
const CK=15, CBASE=290, CHY=v=>CBASE-v*1.04;
/* the hormone strip is drawn ONCE (three cycles side by side); moving the day only slides it with a transform */
function stripHTML(L,O,f){
  const gg=(x,mu,sl,sr)=>{const z=(x-mu)/(x<mu?sl:sr);return Math.exp(-.5*z*z);};
  const fsh2=x=>4+14*gg(x,1.2,1,3)+34*gg(x,O-.6,1.6,1.8)+8*gg(x,L+1,2.2,2.2);
  const val=(key,x)=>{const y=((x-1)%L+L)%L+1;return key==='fsh'?fsh2(y):f[key](y);};
  const a=1-L,b=2*L,lp=O+(L-O)*.5;
  let s='';
  [['fsh','--w-fsh',1],['lh','--w-lh',1.1],['e2','--w-e',.77],['p','--w-p',.6]].forEach(r=>{
    let d='M'+(a*CK)+' '+CBASE;
    for(let x=a;x<=b+.001;x+=.25)d+='L'+(x*CK).toFixed(1)+' '+CHY(val(r[0],x)*r[2]/1.04).toFixed(1);
    s+='<path class="wa" style="fill:var('+r[1]+')" d="'+d+'L'+(b*CK)+' '+CBASE+'Z"/>';
  });
  return s;
}
function wheelHTML(info){
  const L=info.L,O=info.O,M=info.M,C=WG,f=curvesFor(L,O),todayD=Math.min(info.d,L);
  const f1=Math.max(1,O-4),f2=Math.min(L,O);
  let g='<circle class="w-track" cx="'+C.CX+'" cy="'+C.CY+'" r="'+C.R+'" stroke-width="'+C.SW+'"/>';
  g+='<path class="w-fert" stroke-width="'+C.SW+'" d="'+spanPath(C.R,L,f1,f2)+'"/>';
  g+='<path class="w-capo" stroke-width="'+(C.SW+14)+'" d="'+spanPath(C.R,L,1,M)+'"/><path class="w-cap" stroke-width="'+(C.SW+6)+'" d="'+spanPath(C.R,L,1,M)+'"/>';
  for(let d=1;d<=L;d++){
    const p=polar(C.CX,C.CY,C.R,alphaOf(d,L));
    g+='<circle class="w-dot'+((d>=f1&&d<=f2)||d<=M?' f':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+((d>=f1&&d<=f2)||d<=M?2.7:2.3)+'"/>';
  }
  const pt=polar(C.CX,C.CY,C.R,alphaOf(todayD,L));
  g+='<g transform="translate('+pt[0].toFixed(1)+' '+pt[1].toFixed(1)+')"><circle class="w-knob" r="9"/><circle class="w-knob-c" r="3.4"/></g>';
  wheel={f1:f1,f2:f2,L:L,O:O,M:M,start:info.start,late:info.late,todayD:todayD,f:f,d:null,dc:todayD,strip:null,badge:null};
  const defs='<defs><clipPath id="wClip"><circle cx="180" cy="184" r="124"/></clipPath></defs>';
  return '<svg id="wheel" viewBox="0 0 360 364" role="slider" tabindex="0" aria-label="Jour du cycle" aria-valuemin="1" aria-valuemax="'+L+'" aria-valuenow="'+todayD+'">'
    +defs+'<g>'+g+'</g>'
    +'<g clip-path="url(#wClip)"><g id="wStrip" transform="translate('+(180-todayD*CK)+' 0)">'+stripHTML(L,O,f)+'</g>'
    +'<g id="wLabels"><text class="lbl lb-e" id="lbE" text-anchor="middle">Œstrogène</text><text class="lbl lb-lh" id="lbL" text-anchor="middle">LH</text><text class="lbl lb-p" id="lbP" text-anchor="middle">Progestérone</text><text class="lbl lb-fsh" id="lbF" text-anchor="middle">FSH</text></g></g>'
    +'<g id="wBadgeG" transform="translate(180 44)"><circle id="wBadge" class="w-badge" r="34"/><text id="wBadgeK" class="w-badge-k" y="-7">Jour</text><text class="w-badge-n" id="wBadgeN" y="17">'+todayD+'</text></g>'
    +'<g id="wTxt"><text class="w-date" id="wDate" x="180" y="94"></text><text class="w-phase" id="wPhase" x="180" y="134"></text>'
    +'<text class="w-status" id="wStatus" x="180" y="160"></text></g></svg>';
}
function placeLabels(d){
  const w=wheel;if(!w)return;
  const L=w.L,O=w.O,lp=O+(L-O)*.5;
  const off=nat=>((nat-d+L/2)%L+L)%L-L/2;
  const put=(id,nat,y,hw,vis)=>{
    const el=document.getElementById(id);if(!el)return null;
    const o=off(nat);
    if(Math.abs(o)>(vis||7)){el.setAttribute('visibility','hidden');return null;}
    const lim=Math.max(0,Math.sqrt(Math.max(0,112*112-(y-184)*(y-184)))-hw);
    let x=clamp(o*CK,-lim,lim);
    el.setAttribute('visibility','visible');
    el.setAttribute('x',(180+x).toFixed(1));el.setAttribute('y',y.toFixed(1));
    return x;
  };
  const sec=off(O-1.5)<-8;
  const xe=put('lbE',sec?lp-.2:O-1.5,sec?253:214,30);
  put('lbL',O-.6,187,8);
  put('lbF',O+.1,270,15);
  let yp=218;
  const xp0=off(lp)*CK;
  if(xe!=null&&!sec){const lim=Math.max(0,Math.sqrt(112*112-34*34)-46);const dx=Math.abs(Math.min(xp0,lim)-xe);yp=218+Math.max(0,80-dx)*.65;}
  put('lbP',lp,yp,46,10);
}
function moveBadge(dc){
  const w=wheel;if(!w||!w.badge)return;
  const p=polar(WG.CX,WG.CY,WG.R,alphaOf(dc,w.L));
  w.badge.setAttribute('transform','translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')');
}
function phaseLabel(d,w){
  const ph=phaseDay(d,w.M,w.O);
  return ph==='lut'?(d>=w.L-5?'Fin lutéale':'Début lutéale'):WLAB[ph];
}
const isAbsent=n=>!!(D&&D.wins&&D.wins.some(w=>w.state==='absent'&&n>=w.s&&n<=w.e));
function wheelText(d){
  const w=wheel,ph=phaseDay(d,w.M,w.O);
  const late=d===w.todayD&&w.late>0;
  const n=late?T:w.start+d-1;
  const lbl=phaseLabel(d,w);
  const fe=fertAt(d,w.O);
  const tri=(d>=w.f1&&d<=w.f2)?'<tspan class="tri-hi">▲</tspan>':'<tspan class="tri-lo">▼</tspan>';
  let s2;
  if(late)s2=(D.wins.some(x=>x.state==='absent'))?'Absence de règles':'Retard de '+plural(w.late,'jour');
  else if(ph==='mens')s2='Règles · jour '+d;
  else{const r=w.start+w.L-n;s2='Règles dans <tspan class="'+(r<=1?'hot1':r<=7?'hot2':'far')+'">'+plural(r,'jour')+'</tspan>';}
  $('#wDate').textContent=fWheel(n);
  $('#wPhase').textContent=lbl;
  $('#wStatus').innerHTML=tri+' Fécondité · '+s2;
  $('#wBadgeN').textContent=d;
  const td=d===w.todayD;
  const bd=$('#wBadge');
  let th=((TH1-(d-1)*360/w.L)%360+360)%360;if(th>180)th-=360;
  const compact=!td&&((th>=32&&th<=105)||(th<=-22&&th>=-92)), fert=compact&&d>=w.f1&&d<=w.f2;
  if(bd){
    bd.classList.toggle('today',td);bd.classList.toggle('fert',fert);
    bd.setAttribute('r',compact?'18':'34');
    $('#wBadgeK').style.display=compact?'none':'';
    $('#wBadgeN').setAttribute('y',compact?'7':'17');
    $('#wBadgeN').style.fontSize=compact?'17px':'';
  }
  const sh=(th>-20&&th<30)?33:0,ov=ph==='ovul'?1:0;
  $('#wDate').style.transform='translateY('+sh+'px)';
  $('#wPhase').style.transform='translateY('+(sh+ov*5)+'px)';
  $('#wStatus').style.transform='translateY('+(sh+ov*10)+'px)';
  const sv=$('#wheel');
  sv.setAttribute('aria-valuenow',d);
  sv.setAttribute('aria-valuetext','Jour '+d+', '+fWk(n)+', '+lbl.toLowerCase()+', fécondité '+fe.k);
  const bk=$('#wBack');if(bk)bk.hidden=td;
}
function bodyHTML(d){
  const w=wheel,ph=phaseDay(d,w.M,w.O),a=ADV[ph];
  const td=d===w.todayD,late=td&&w.late>0;
  const n=late?T:w.start+d-1;
  const logged=hasLog(toISO(T));
  const nextN=w.start+w.L;
  const body=late?LATE:(ph==='lut'&&d>=w.L-4)?a.late:a.body;
  let btn;
  if(td&&!logged)btn='<button class="row-btn" data-act="log-today"><span>Ajoute un nouveau symptôme</span><span class="go">'+ARROW+'</span></button>';
  else btn='<button class="row-btn" data-act="recap"><span>'+(late?'Voir mon retard':'Prévoir le '+fDay(nextN))+'</span><span class="go">'+ARROW+'</span></button>';
  const lg=td?(S.logs[toISO(T)]||{}):{},items=[].concat(lg.mood||[],lg.sym||[]);
  return btn
    +(items.length?'<div class="tags">'+items.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')
    +'<p class="meta">'+fLong(n)+' · Phase '+(ph==='lut'&&d>=w.L-4?'prémenstruelle':PH[ph].name.toLowerCase())+' · jour '+d+'</p>'
    +'<p>'+(late?'':'<b>'+a.head+'.</b> ')+body+'</p>'
    +'<button class="btn" data-act="goto-advice" data-ph="'+ph+'">Voir les idées pour cette phase</button>';
}
function updateBody(d){
  const el=$('#focusCard');if(!el||!wheel)return;
  el.innerHTML=bodyHTML(d);
}
let bodyRaf=0,bodyD=0;
function scheduleBody(d){
  bodyD=d;
  if(typeof requestAnimationFrame!=='function'){updateBody(d);return;}
  if(!bodyRaf)bodyRaf=requestAnimationFrame(()=>{bodyRaf=0;updateBody(bodyD);});
}
function setWheel(dc){
  const w=wheel;if(!w)return;
  const L=w.L;
  dc=((dc-1)%L+L)%L+1;
  w.dc=dc;
  if(w.strip)w.strip.setAttribute('transform','translate('+(180-Math.round(dc)*CK)+' 0)');
  moveBadge(dc);
  let d=Math.round(dc);if(d>L)d=1;
  if(d!==w.d){w.d=d;wheelText(d);placeLabels(d);selDay=(d===w.todayD)?null:d;if(tab==='explore')updateSel();scheduleBody(d);}
}
/* the ring follows the finger one whole day at a time, like the reference: no gliding */
let wRaf=0,wTarget=0;
function wheelGoto(to){
  const w=wheel;if(!w)return;
  wTarget=((Math.round(to)-1)%w.L+w.L)%w.L+1;
  setWheel(wTarget);
}
const animateTo=wheelGoto;

/* ---------- pill ---------- */
const pillOn=()=>!!(S.pill.on&&S.pill.packStart);
function pillDay(n){
  if(!pillOn())return null;
  const ps=dn(S.pill.packStart);
  if(n<ps)return null;
  if(S.pill.mode==='cont')return {t:'cont',i:n-ps+1};
  const k=(n-ps)%28;
  return k<21?{t:'take',i:k+1}:{t:'pause',i:k-20,back:n+(28-k)};
}
const pillTaken=n=>!!(S.logs[toISO(n)]||{}).pill;
const pillTimeStr=()=>/^\d{2}:\d{2}$/.test(S.pill.time)?S.pill.time:'21:00';
function pillDue(){
  const pd=pillDay(T);
  if(!pd||pd.t==='pause'||!S.pill.remind||pillTaken(T))return false;
  const hm=pillTimeStr().split(':').map(Number),now=new Date();
  return now.getHours()*60+now.getMinutes()>=hm[0]*60+hm[1];
}
const CHECK_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function pillInner(){
  if(!pillOn())return '<button class="row-btn" data-act="pill-setup"><span>Suivre ma pilule</span>'+CHEV_R+'</button>';
  const pd=pillDay(T),tk=pillTaken(T),due=pillDue();

  return '<div class="pill-card'+(due?' due':'')+'"><div class="pc-t"><p class="eyebrow">Pilule</p><b>'+(pd.t==='pause'?'Jour de pause':tk?'Pilule prise':'Pilule du jour')+'</b><span class="pc-s">'+sub+'</span>'+miss+'</div>'+tick
    +'<button class="icon-btn" data-act="pill-settings" aria-label="Réglages de la pilule" style="width:36px;height:36px">'+CHEV_R+'</button></div>';
}
function pillCardHTML(){return '<div id="pillCard">'+pillInner()+'</div>';}
function updatePill(){const el=$('#pillCard');if(el)el.innerHTML=pillInner();}
let lastNotif='';
function pillTick(){
  if(nowN()!==T&&!sheetKind){refreshUI();return;}
  updatePill();
  if(!pillOn()||!S.pill.remind||!pillDue()||lastNotif===toISO(T))return;
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      new Notification('Pilule',{body:"Il est l'heure de ta pilule.",tag:'carnet-pill'});

/* ---------- Explorer (hormones + guide + articles) ---------- */
const VW=360,VH=262,ML=32,MR=12,MT=32,MB=30,IW=VW-ML-MR,IH=VH-MT-MB;
let CH=null;
function hormonesCard(){
  const info=infoAt(T);
  if(!info)return '';
  const L=info.L,O=info.O,M=info.M,f=curvesFor(L,O);
  const X=x=>ML+(x-1)/(L-1)*IW, Y=v=>MT+IH*(1-v/112);
  CH={L:L,O:O,M:M,f:f,X:X,start:info.start,today:Math.min(info.d,L)};
  if(selDay!=null)selDay=clamp(selDay,1,L);
  let s='';
  const bands=[['mens',1,M],['foll',M+1,O-2],['ovul',O-1,O+1],['lut',O+2,L]];
  for(const b of bands){
    if(b[1]>b[2])continue;
    const x1=clamp(X(b[1]-.5),ML,ML+IW),x2=clamp(X(b[2]+.5),ML,ML+IW);
    s+='<rect class="band b-'+b[0]+'" x="'+x1.toFixed(1)+'" y="'+MT+'" width="'+(x2-x1).toFixed(1)+'" height="'+IH+'"/>';
    const lbl=PH[b[0]].short;
    if(x2-x1>lbl.length*5.6+4)s+='<text class="pl" x="'+((x1+x2)/2).toFixed(1)+'" y="'+(MT-11)+'" text-anchor="middle">'+lbl+'</text>';
  }
  [0,25,50,75,100].forEach(v=>{s+='<line class="'+(v===0?'axl':'gl')+'" x1="'+ML+'" x2="'+(ML+IW)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>';});
  s+='<text class="ax" x="'+(ML-6)+'" y="'+(Y(100)+3).toFixed(1)+'" text-anchor="end">haut</text><text class="ax" x="'+(ML-6)+'" y="'+(Y(0)+3).toFixed(1)+'" text-anchor="end">bas</text>';
  const base=[1];for(let t=7;t<L;t+=7)base.push(t);base.push(L);
  const tk=[];
  for(const t of base){
    if(t!==1&&t!==L&&Math.abs(t-O)<3)continue;
    if(tk.length&&t-tk[tk.length-1]<3){if(t===L)tk.pop();else continue;}
    tk.push(t);
  }
  tk.push(O);tk.sort((a,b)=>a-b);
  tk.forEach(t=>{
    s+='<text class="ax'+(t===O?' strong':'')+'" x="'+X(t).toFixed(1)+'" y="'+(MT+IH+19)+'" text-anchor="middle">J'+t+'</text>';
  });
  s+='<circle class="ov-dot" cx="'+X(O).toFixed(1)+'" cy="'+(MT+IH)+'" r="5"/>';
  const lab={e2:{mu:O-1.8,a:'end',dx:-6,dy:-5},lh:{mu:O-1,a:'start',dx:6,dy:-5},p:{mu:O+(L-O)*.5,a:'middle',dx:0,dy:-8},fsh:{mu:1,a:'start',dx:7,dy:-6}};
  for(const r of SER){
    if(!vis[r.k])continue;
    let d='';
    for(let x=1;x<=L+.001;x+=.25){d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(f[r.k](x)).toFixed(1);}
    s+='<path class="curve" style="stroke:var('+r.c+')" d="'+d+'"/>';
    const q=lab[r.k];
    s+='<text class="dl" x="'+(X(q.mu)+q.dx).toFixed(1)+'" y="'+(Y(f[r.k](q.mu))+q.dy).toFixed(1)+'" text-anchor="'+q.a+'">'+r.n+'</text>';
  }
  s+='<g id="selg"></g><rect x="'+ML+'" y="'+(MT-14)+'" width="'+IW+'" height="'+(IH+14)+'" fill="transparent"/>';
  return '<article class="card"><div><p class="eyebrow">Courbes schématiques</p><h2>Tes hormones sur ce cycle</h2></div>'
    +'<div class="hchips" role="group" aria-label="Hormones affichées">'
    +SER.map(r=>'<button type="button" class="hchip" data-act="h-toggle" data-k="'+r.k+'" aria-pressed="'+vis[r.k]+'" style="--hc:var('+r.c+')"><i></i>'+r.n+'</button>').join('')+'</div>'
    +'<svg id="chart" viewBox="0 0 '+VW+' '+VH+'" role="img" aria-label="Courbes relatives d\'œstradiol, de progestérone, de LH et de FSH sur un cycle de '+L+' jours, ovulation estimée au jour '+O+'">'+s+'</svg>'
    +'<div class="slider-wrap"><label for="daySlider">Fais glisser pour explorer chaque jour du cycle</label><input id="daySlider" type="range" min="1" max="'+L+'" value="'+(selDay==null?CH.today:selDay)+'"></div>'
    +'<div id="readout"></div>'
    +'<p class="muted small">Échelle relative d\'un cycle type, ajustée à la durée de ton cycle. Chaque courbe est tracée à sa propre échelle : ce ne sont pas des dosages et les niveaux réels varient d\'une personne à l\'autre. Le point jaune marque l\'ovulation estimée.</p>'
    +'<details><summary>À quoi servent ces hormones ?</summary><div class="hdesc">'+HORMONES.map(x=>'<p><strong>'+x[0]+'.</strong> '+x[1]+'</p>').join('')+'</div></details>'
    +'<details><summary>Voir les niveaux jour par jour</summary><div class="tbl"><table><thead><tr><th>Jour</th><th>Phase</th>'+SER.map(r=>'<th>'+r.n+'</th>').join('')+'</tr></thead><tbody>'
    +Array.from({length:L},(_,i)=>{const d=i+1;return '<tr><th>J'+d+'</th><td>'+PH[phaseDay(d,M,O)].name+'</td>'+SER.map(r=>'<td>'+lv(f[r.k](d))+'</td>').join('')+'</tr>';}).join('')
    +'</tbody></table></div></details></article>';
}
function updateSel(){

  for(const r of SER){
    if(!vis[r.k])continue;
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+Y(CH.f[r.k](d)).toFixed(1)+'" r="4.5" style="fill:var('+r.c+');stroke:var(--surface);stroke-width:2"/>';

    +'<div class="ro-list">'+SER.map(r=>{const v=CH.f[r.k](d);return '<div class="ro-row"><span class="key" style="background:var('+r.c+')"></span><span class="ro-name">'+r.n+'</span><span class="meter"><i style="width:'+clamp(v,2,100).toFixed(0)+'%;background:var('+r.c+')"></i></span><strong class="ro-val">'+lv(v)+'</strong></div>';}).join('')+'</div>'

function chartPointer(e,sv){

function patternsHTML(){
  const cnt={},tot={};

    const lg=S.logs[k];
    if(!lg.sym||!lg.sym.length||dn(k)>T)return;
    const inf=infoAt(dn(k));
    if(!inf)return;
    lg.sym.forEach(y=>{tot[y]=(tot[y]||0)+1;cnt[y]=cnt[y]||{};cnt[y][inf.ph]=(cnt[y][inf.ph]||0)+1;});
  });

    const best=Object.keys(cnt[y]).sort((a,b)=>cnt[y][b]-cnt[y][a])[0];

  });
  return '<article class="card"><div><p class="eyebrow">Tendances</p><h2>Tes symptômes selon la phase</h2></div>'
    +(rows.length?'<ul class="pat">'+rows.join('')+'</ul><p class="muted small" style="margin-top:10px">Calculé à partir de tes notes. Un symptôme apparaît ici dès que tu l\'as noté 3 fois.</p>'

}

/* ---------- Calendar ---------- */
function monthHTML(y,m,cur){
  const first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;
  const firstN=Math.round(Date.UTC(y,m,1)/DAY);
  const title=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(first);
  let cells='';
  ['L','M','M','J','V','S','D'].forEach(d=>{cells+='<span class="dow" aria-hidden="true">'+d+'</span>';});
  for(let i=0;i<off;i++)cells+='<span class="day blank"></span>';
  for(let d=1;d<=dim;d++){
    const n=firstN+d-1,info=infoAt(n),lg=S.logs[toISO(n)]||{};
    const cls=['day'];
    let aria=fLong(n);
    if(n===T)cls.push('today');
    if(n>T)cls.push('future');
    const ab=isAbsent(n);
    if(ab)cls.push('absent');
    if(info){
      aria+=', jour '+info.d+' du cycle, phase '+PH[info.ph].name.toLowerCase();
      if(lg.flow>0)cls.push('period');
      else if(info.ph==='mens'&&!(n<T&&!info.proj)&&!ab)cls.push('est');
      if(info.fertile&&info.ph!=='mens'&&n>=T-0)cls.push('fertile');
      if(info.ovu){cls.push('ovu');aria+=', ovulation estimée';}
      else if(info.fertile)aria+=', fenêtre fertile estimée';
    }
    if(lg.flow>0)aria+=', règles notées';
    if(ab)aria+=', absence de règles';
    const pd=n<=T?pillDay(n):null,pk=pd&&pd.t!=='pause'&&lg.pill;
    if(pk)aria+=', pilule prise';
    const logged=(lg.mood&&lg.mood.length)||(lg.sym&&lg.sym.length)||lg.note||lg.energy!=null;
    cells+='<button type="button" class="'+cls.join(' ')+'" data-act="open-day" data-n="'+n+'" aria-label="'+aria+'">'+d+(logged?'<span class="dot"></span>':'')+(pk?'<span class="pk"></span>':'')+'</button>';
  }
  return '<section'+(cur?' id="m-cur"':'')+' aria-label="'+title+'"><h2 class="month-t">'+title+'</h2><div class="cal">'+cells+'</div></section>';
}
function renderCalendar(){
  const t=dateOf(T);
  let months='';
  for(let k=-2;k<=4;k++){const d=new Date(t.getFullYear(),t.getMonth()+k,1);months+=monthHTML(d.getFullYear(),d.getMonth(),k===0);}
  const h='<h1 class="ttl">Calendrier</h1>'
    +'<div class="cal-legend"><span><i class="lg-per"></i>Règles</span><span><i class="lg-est"></i>Règles prévues</span><span><i class="lg-fer"></i>Fenêtre fertile</span><span><i class="lg-ovu"></i>Ovulation estimée</span><span><i class="lg-abs"></i>Absence de règles</span></div>'
    +'<p class="muted small">Touche un jour pour le noter, ou ajoute des règles passées pour affiner tes prévisions.</p>'
    +'<button class="btn" data-act="period-new">+ Ajouter des règles passées</button>'
    +months
    +'<article class="card"><div><p class="eyebrow">Historique</p><h2>Tes derniers cycles</h2></div>'+historyHTML()+'</article>';
  $('#tab-calendar').innerHTML=h;
}
function historyHTML(){
  const R=D.real;
  if(D.demo)return '<p class="muted">Entre tes dernières règles, puis ajoute les précédentes pour voir ici la durée de chaque cycle.</p>';
  const items=[];
  R.forEach((r,i)=>{items.push({t:'run',s:r.start,e:r.end,M:r.M,len:i<R.length-1?R[i+1].start-r.start:null});});
  D.wins.filter(w=>w.state==='absent').forEach(w=>items.push({t:'abs',s:w.s,e:w.e}));
  items.sort((a,b)=>b.s-a.s);
  const show=items.slice(0,12);
  const max=Math.max(45,...show.map(r=>r.len||0));
  let h='<ul class="hist">'+show.map(r=>{
    if(r.t==='abs')return '<li><button class="hrow" data-act="open-day" data-n="'+r.s+'"><span class="h-date"><b>'+fShort(r.s)+'</b><span>– '+fShort(r.e)+'</span></span><span class="h-abs">Absence de règles</span>'+CHEV_R+'</button></li>';
    const rest=r.len?(r.len-r.M):0;
    return '<li><button class="hrow" data-act="edit-period" data-s="'+r.s+'" data-e="'+r.e+'" aria-label="Règles du '+fDay(r.s)+' au '+fDay(r.e)+(r.len?', cycle de '+r.len+' jours':', cycle en cours')+'. Modifier"><span class="h-date"><b>'+fShort(r.s)+'</b><span>'+plural(r.e-r.s+1,'jour')+'</span></span>'
      +'<span class="h-bar" aria-hidden="true"><i class="m" style="width:'+(r.M/max*100).toFixed(1)+'%"></i>'+(r.len?'<i class="r" style="width:'+(rest/max*100).toFixed(1)+'%"></i>':'')+'</span>'
      +'<span class="h-len mono">'+(r.len?r.len+' j':'en cours')+'</span>'+CHEV_R+'</button></li>';
  }).join('')+'</ul>';
  const lens=items.filter(x=>x.len&&x.len>=18&&x.len<=60).map(x=>x.len);
  if(lens.length)h+='<p class="muted small" style="margin-top:12px">Cycle moyen : '+Math.round(avg(lens))+' jours'+(lens.length>1?' (de '+Math.min(...lens)+' à '+Math.max(...lens)+')':'')+' · règles : '+D.P+' jours. Plus tu ajoutes de cycles passés, plus la prévision s\'affine.</p>';
  else h+='<p class="muted small" style="margin-top:12px">Ajoute au moins deux débuts de règles passés pour que le carnet calcule ta durée de cycle.</p>';
  return h;
}

    +CATS.map(c=>'<button class="cat" data-act="adv-cat" data-c="'+c[0]+'" aria-pressed="'+(!favOnly&&advCat===c[0])+'">'+c[1]+'</button>').join('')+'</div>';

  }else{

  h+='<button class="btn" data-act="goto-explore">Lire le guide complet de la phase</button>';
  $('#tab-advice').innerHTML=h;

document.addEventListener('click',e=>{

    case 'menu':openSheet('menu');break;

    case 'period-new':closeSheet();openSheet('period',{});break;
    case 'edit-period':closeSheet();openSheet('period',{s:+b.dataset.s,e:+b.dataset.e});break;
    case 'period-save':savePeriod(false);break;
    case 'period-save-more':savePeriod(true);break;
    case 'period-delete':{
      const a2=sheetArg;if(!a2||a2.s==null)break;
      for(let n=a2.s;n<=a2.e;n++)clearFlow(n);
      commit();closeSheet();break;
    }
    case 'miss-yes':openSheet('period',{pre:+b.dataset.s});break;
    case 'miss-no':S.skips[b.dataset.k]=1;commit();break;
    case 'miss-later':askDismissed=b.dataset.k;renderToday();break;
    case 'unskip':delete S.skips[b.dataset.k];commit();renderSheet();break;

    case 'pill-settings':closeSheet();openSheet('pill');break;
    case 'pill-toggle':{S.pill.on=!S.pill.on;if(S.pill.on&&!S.pill.packStart)S.pill.packStart=toISO(T);commit();renderSheet();break;}
    case 'pill-mode':S.pill.mode=v==='cont'?'cont':'21';commit();renderSheet();break;
    case 'pill-remind':{
      S.pill.remind=!S.pill.remind;commit();renderSheet();
      if(S.pill.remind){try{if('Notification' in window&&Notification.permission==='default'){const r=Notification.requestPermission();if(r&&r.then)r.then(()=>{if(sheetKind==='pill')renderSheet();});}}catch(_){}}
      break;
    }
    case 'pill-test':{try{if('Notification' in window&&Notification.permission==='granted')new Notification('Pilule',{body:'Voici à quoi ressemblera ton rappel.',tag:'carnet-pill-test'});}catch(_){}break;}
    case 'pill-today':setLog(toISO(T),l=>{l.pill=!l.pill;},true);if(sheetKind==='menu')closeSheet();break;
    case 'pill-day':setLog(toISO(sheetDay),l=>{l.pill=!l.pill;},true);syncDay();break;
    case 'period-start':setLog(toISO(T),l=>{if(!(l.flow>0))l.flow=2;});break;
    case 'period-end':setLog(toISO(T),l=>{l.flow=0;});break;
    case 'open-day':openSheet('day',+b.dataset.n);break;
    case 'adv-next':{const info=infoAt(T),cur=advPhase||(info?info.ph:'foll');advPhase=PH_ORDER[(PH_ORDER.indexOf(cur)+1)%4];renderAdvice();break;}
    case 'adv-cat':advCat=b.dataset.c;favOnly=false;renderAdvice();break;
    case 'adv-fav':favOnly=!favOnly;renderAdvice();break;
    case 'tile':{const id=b.dataset.id;S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):S.favs.concat(id);S.updatedAt=Date.now();saveLocal();queueRemote();renderAdvice();break;}
    case 'h-toggle':{const k=b.dataset.k;const on=SER.filter(r=>vis[r.k]).length;if(vis[k]&&on<=1)break;vis[k]=!vis[k];renderExplore();break;}
    case 'close-sheet':closeSheet();break;
    case 'flow':setLog(toISO(sheetDay),l=>{l.flow=+v;});syncDay();break;
    case 'energy':setLog(toISO(sheetDay),l=>{l.energy=(l.energy===+v)?undefined:+v;});syncDay();break;
    case 'mood':setLog(toISO(sheetDay),l=>{l.mood=toggleIn(l.mood,v);});syncDay();break;
    case 'sym':setLog(toISO(sheetDay),l=>{l.sym=toggleIn(l.sym,v);});syncDay();break;
    case 'step':{
      const key=b.dataset.key,lim={cycleLen:[21,45],periodLen:[2,10],luteal:[10,16]}[key];

function clearFlow(n){const k=toISO(n),lg=Object.assign({},S.logs[k]);delete lg.flow;if(Object.keys(lg).length)S.logs[k]=lg;else delete S.logs[k];}
function savePeriod(more){
  const err=$('#pErr'),show=t=>{err.textContent=t;err.hidden=false;};
  const sv=$('#pStart').value,ev=$('#pEnd').value||sv;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(sv))return show('Choisis le premier jour des règles.');
  const a=dn(sv),b=dn(ev);
  if(a>T||b>T)return show("Les dates doivent être aujourd'hui ou dans le passé.");
  if(b<a)return show('Le dernier jour doit être après le premier.');
  if(b-a>13)return show('Les règles durent au plus 14 jours : vérifie les dates.');
  const old=sheetArg;
  if(old&&old.s!=null)for(let n=old.s;n<=old.e;n++)clearFlow(n);
  for(let n=a;n<=b;n++){const k=toISO(n),lg=Object.assign({},S.logs[k]);if(!(lg.flow>0))lg.flow=2;S.logs[k]=lg;}
  Object.keys(S.skips).forEach(k=>{if(Math.abs(dn(k)-a)<=10)delete S.skips[k];});
  commit();
  if(more){periodMsg='Règles du '+fDay(a)+' au '+fDay(b)+' enregistrées. Ajoute la suivante.';sheetArg={};renderSheet();const f=$('#pStart');if(f)f.focus();}
  else closeSheet();
}

  const err=$('#obErr');
  const show=t=>{err.textContent=t;err.hidden=false;};

  if(!/^\d{4}-\d{2}-\d{2}$/.test(sv))return show('Choisis la date du premier jour de tes dernières règles.');

  if(T-start>120)return show('Choisis une date des quatre derniers mois.');
  const dur=clamp(Math.round(+$('#obDur').value)||5,2,10);
  const cyc=clamp(Math.round(+$('#obCyc').value)||28,21,45);
  S.settings.periodLen=dur;S.settings.cycleLen=cyc;
  for(let i=0;i<dur;i++){
    const n=start+i;
    if(n>T)break;
    const k=toISO(n),lg=Object.assign({},S.logs[k]);
    if(lg.flow==null)lg.flow=2;
    S.logs[k]=lg;

/* ---------- wheel gestures: the ring is fixed; the finger sets the day ---------- */
function wptr(e,sv){
  const r=sv.getBoundingClientRect(),k=r.width/360;
  const dx=e.clientX-(r.left+180*k),dy=e.clientY-(r.top+WG.CY*k);
  return {ang:Math.atan2(dy,dx)*180/Math.PI,dist:Math.hypot(dx,dy)/k};
}
function dcFromAng(ang){
  const L=wheel.L;
  const x=1+(TH1-(ang+90))*L/360;
  return ((x-.5)%L+L)%L+.5;
}
document.addEventListener('pointerdown',e=>{
  const sv=e.target.closest&&e.target.closest('#wheel');
  if(!sv||!wheel)return;
  const p=wptr(e,sv);
  if(p.dist<88||p.dist>182)return;
  wd={id:e.pointerId,sv:sv,moved:0,sx:e.clientX,sy:e.clientY};
  try{sv.setPointerCapture(e.pointerId);}catch(_){}
  wheelGoto(dcFromAng(p.ang));
});
document.addEventListener('pointermove',e=>{
  if(!wd||e.pointerId!==wd.id||!wheel)return;
  wd.moved=Math.max(wd.moved,Math.hypot(e.clientX-wd.sx,e.clientY-wd.sy));
  if(wd.moved<4)return;
  wheelGoto(dcFromAng(wptr(e,wd.sv).ang));
},{passive:true});
function wEnd(e){
  if(!wd||e.pointerId!==wd.id||!wheel)return;
  const s=wd;wd=null;

}
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,wEnd));
document.addEventListener('keydown',e=>{
  if(!wheel||!e.target||e.target.id!=='wheel')return;
  const k=e.key;
  const cur=wheel.d;
  if(k==='ArrowRight'||k==='ArrowUp'){e.preventDefault();wheelGoto(cur+1);}
  else if(k==='ArrowLeft'||k==='ArrowDown'){e.preventDefault();wheelGoto(cur-1);}
  else if(k==='Home'){e.preventDefault();wheelGoto(wheel.todayD);}
});

/* ---------- start ---------- */
const loc=loadLocal();
if(loc)adopt(loc);
refreshUI();
setTab('today');
initSync();
setInterval(pillTick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pillTick();});
})();
</script>

<script>
if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    let reloaded=false,had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return;}if(reloaded)return;reloaded=true;location.reload();});
    navigator.serviceWorker.register('sw.js').then(r=>{
      const check=()=>r.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
      setInterval(check,3600000);
    }).catch(()=>{});
  });
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
</script>
